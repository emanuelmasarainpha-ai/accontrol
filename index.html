<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!--
      Política de seguridad (CSP): el navegador SOLO ejecuta código y carga recursos de este mismo sitio.
      Sin scripts ni estilos escritos dentro del HTML, sin librerías externas, sin conexiones a otros servidores.
      Si algún día una librería externa se rompe o es atacada, no puede tocar tus datos financieros.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://vuzlguqrbwgvyduysfkh.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#34204f" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="ACCONTROL: tus finanzas personales en un solo lugar." />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ACCONTROL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ACCONTROL</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Modo oscuro antes de dibujar (sin destello blanco al abrir de noche). -->
    <script src="src/theme-boot.js"></script>
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/charts.css" />
    <link rel="stylesheet" href="src/styles/views.css" />
    <link rel="stylesheet" href="src/styles/motion.css" />
    <link rel="stylesheet" href="src/styles/roles.css" />

    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <!-- Intro del logo al abrir la app (src/ui/intro.js). Solo se ve si theme-boot.js puso la clase has-intro. -->
    <div class="intro" id="intro" aria-hidden="true"></div>

    <a class="skip-link" href="#view">Saltar al contenido</a>

    <div class="app">
      <aside class="sidebar" aria-label="Menú principal">
        <a class="brand" href="#/inicio" aria-label="ACCONTROL, ir a Inicio">
          <img class="brand__mark" src="icons/mark.svg" alt="" width="36" height="36" />
          <span class="brand__name">ACCONTROL</span>
        </a>
        <button type="button" class="ws-switch ws-switch--side" data-action="workspace-menu" data-tour="workspace-switch" data-workspace-switch aria-haspopup="dialog" hidden></button>
        <nav aria-label="Pantallas">
          <ul class="nav" id="nav-side"></ul>
        </nav>
        <div class="sidebar__foot">
          <button type="button" class="btn btn--light btn--block" data-action="add-menu" data-tour="add"><span data-icon="plus" data-icon-size="18"></span>Añadir</button>
          <div class="sidebar__row">
            <a class="nav__link" href="#/ajustes" data-route="ajustes"><span data-icon="sliders"></span><span>Ajustes</span></a>
            <button type="button" class="daynight" data-action="toggle-theme" aria-pressed="false" aria-label="Modo oscuro"></button>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <a class="brand brand--dark" href="#/inicio" aria-label="ACCONTROL, ir a Inicio">
            <img class="brand__mark" src="icons/mark.svg" alt="" width="30" height="30" />
            <span class="brand__name">ACCONTROL</span>
          </a>
          <button type="button" class="ws-switch ws-switch--top" data-action="workspace-menu" data-tour="workspace-switch" data-workspace-switch aria-haspopup="dialog" hidden></button>
          <button type="button" class="daynight" data-action="toggle-theme" aria-pressed="false" aria-label="Modo oscuro"></button>
          <a class="icon-btn" href="#/ajustes" data-route="ajustes" aria-label="Ajustes"><span data-icon="sliders"></span></a>
        </header>

        <main id="view" class="view" tabindex="-1">
          <p class="loading" role="status">Cargando…</p>
          <noscript><p class="loading">ACCONTROL necesita JavaScript activado para funcionar.</p></noscript>
        </main>
      </div>

      <nav class="tabbar" aria-label="Pantallas">
        <ul class="tabbar__list" id="nav-tabs"></ul>
      </nav>

      <button type="button" class="fab" data-action="add-menu" data-tour="add" aria-label="Añadir movimiento o ahorro"><span data-icon="plus" data-icon-size="26"></span></button>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
