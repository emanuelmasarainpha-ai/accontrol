apply plugin: 'com.android.application'
import groovy.json.JsonSlurper

// ACCONTROL: la versión sale de package.json (una sola fuente). versionCode crece solo:
// 0.17.5 -> 1705, 1.0.0 -> 10000. Android solo instala encima si el número es mayor.
def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def versionParts = appVersion.tokenize('.').collect { it.toInteger() }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// ACCONTROL: la firma de las versiones para instalar vive FUERA del proyecto y de OneDrive
// (~/.accontrol-firma/firma.properties, la crea `npm run android:firma`). Nunca se sube a GitHub.
def firmaFile = new File(System.getProperty('user.home'), '.accontrol-firma/firma.properties')
def firma = new Properties()
if (firmaFile.exists()) { firmaFile.withInputStream { firma.load(it) } }

// ACCONTROL (0.18.4): copia src/main/assets (lo que deja `npx cap sync`: la app web y la configuración de
// Capacitor) a la carpeta de compilación, con lectura normal de archivos, antes de empaquetar. Sin seguimiento de
// estado (se copia siempre; son unos 4 MB), porque Gradle no puede vigilar los archivos que OneDrive convierte.
def webAssetsSrc = file('src/main/assets')
def webAssetsOut = layout.buildDirectory.dir('accontrol-web-assets').get().asFile
def copyWebAssets = tasks.register('copyWebAssets') {
    doNotTrackState('OneDrive convierte los archivos de assets en marcadores que Gradle no puede vigilar')
    doLast {
        if (webAssetsOut.exists()) webAssetsOut.deleteDir()
        def src = webAssetsSrc.toPath()
        def out = webAssetsOut.toPath()
        java.nio.file.Files.walk(src).withCloseable { paths ->
            paths.each { p ->
                def target = out.resolve(src.relativize(p).toString())
                if (java.nio.file.Files.isDirectory(p)) {
                    java.nio.file.Files.createDirectories(target)
                } else {
                    java.nio.file.Files.createDirectories(target.parent)
                    java.nio.file.Files.copy(p, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
}
tasks.matching { it.name ==~ /merge\w*Assets/ }.configureEach { dependsOn copyWebAssets }

android {
    namespace = "com.accontrol.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.accontrol.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ACCONTROL: sin la revisión «lint» al crear el APK final. OneDrive convierte los archivos de
    // assets/public en marcadores (ReparsePoint) y lint no los puede leer («not a regular file»).
    // La app es web: lint revisa código Java/Kotlin de Android, que aquí es el de Capacitor.
    lint {
        checkReleaseBuilds = false
    }
    // ACCONTROL (0.18.4): los archivos web se empaquetan desde una COPIA en la carpeta de compilación (fuera de
    // OneDrive). Gradle se niega a vigilar los marcadores de OneDrive («not a regular file») y el APK fallaba al
    // juntar los archivos (mergeReleaseAssets). Ver la tarea copyWebAssets más abajo.
    sourceSets {
        main {
            assets.srcDirs = [webAssetsOut]
        }
    }
    signingConfigs {
        if (firmaFile.exists()) {
            release {
                storeFile new File(firmaFile.parentFile, firma.getProperty('storeFile'))
                storePassword firma.getProperty('storePassword')
                keyAlias firma.getProperty('keyAlias')
                keyPassword firma.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (firmaFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
