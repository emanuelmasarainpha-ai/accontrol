// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // ACCONTROL: en Windows, lo que se genera al compilar va FUERA de la carpeta del proyecto.
    // El proyecto vive en el Escritorio, que OneDrive sincroniza: OneDrive abre esos archivos
    // mientras se copian y Gradle ya no puede borrarlos («Unable to delete directory ...»).
    def localAppData = System.getenv('LOCALAPPDATA')
    if (localAppData) {
        layout.buildDirectory = new File(localAppData, "accontrol-android-build/${project.name}")
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
